name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 3 */3 * *'   # 每 3 天跑一次（UTC 03:00），遠低於 Supabase 免費方案 7 天暫停門檻
  workflow_dispatch:         # 允許在 GitHub Actions 頁面手動點擊執行，方便測試

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase to keep project active
        run: |
          curl -s -o /dev/null -w "HTTP status: %{http_code}\n" \
            "https://hiufwsnrzufooxkfyojr.supabase.co/rest/v1/projects?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
